[governor]
	#Hard per-level per-tick callback cap. Deferred events remain in vanilla chunk containers.
	# Default: 512
	# Range: 1 ~ 65536
	waterTicksPerTick = 512
	# Default: 128
	# Range: 1 ~ 65536
	lavaTicksPerTick = 128
	# Default: 128
	# Range: 1 ~ 65536
	otherFluidTicksPerTick = 128
	#Soft budget including collection. Zero disables time limit. At least one of each queued family can run even after expiration.
	# Default: 2.0
	# Range: 0.0 ~ 1000.0
	budgetMs = 2.0
	#Maximum due events collected/examined per level tick; bounds deferral overhead.
	# Default: 2048
	# Range: 16 ~ 65536
	maxCollectedTicks = 2048
	#Chebyshev chunk radius around players; vanilla/NeoForge forced chunks also preferred.
	# Default: 4
	# Range: 0 ~ 32
	priorityRadiusChunks = 4
	#One in N level ticks prefers distant containers within the SAME TickPriority, avoiding proximity starvation.
	# Default: 8
	# Range: 2 ~ 100
	distantServiceEveryTicks = 8

[async]
	#EXPERIMENTAL. Snapshot-only getNewLiquid precomputation for simple vanilla flowing water/lava. All writes/validation and remaining flow logic stay synchronous.
	enabled = false
	# Default: 2
	# Range: 1 ~ 8
	workers = 2
	# Default: 256
	# Range: 8 ~ 4096
	queueCapacity = 256
	#Per-level per-tick snapshot submission cap, only for deferred positions.
	# Default: 8
	# Range: 0 ~ 128
	snapshotsPerTick = 8
	#Never wait for a result. Expired/late/changed/unsafe snapshots use vanilla synchronous flow.
	# Default: 200
	# Range: 1 ~ 5000
	timeoutMs = 200
