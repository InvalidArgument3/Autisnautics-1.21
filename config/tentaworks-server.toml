[reach]
	#Grip Reach of a Copper Rig, blocks. Far Reach adds to it, up to 16 in total
	# Default: 4.0
	# Range: 1.0 ~ 16.0
	copper = 4.0
	#Grip Reach of a Netherite Rig, blocks. Far Reach adds to it, up to 16 in total
	# Default: 7.0
	# Range: 1.0 ~ 16.0
	netherite = 7.0

[speed]
	#Top Rig speed, blocks per second. Caps the Speed in every player's Rig Settings; Swift raises both on its Rig
	# Default: 8.0
	# Range: 1.0 ~ 20.0
	max = 8.0

[air]
	#Copper Rig held still (Idle, Hang): ticks per 1 Air
	# Default: 80.0
	# Range: 1.0 ~ 72000.0
	idle = 80.0
	#Copper Rig moving level or down: ticks per 1 Air
	# Default: 20.0
	# Range: 1.0 ~ 72000.0
	move = 20.0
	#Copper Rig climbing (net +Y): ticks per 1 Air
	# Default: 10.0
	# Range: 1.0 ~ 72000.0
	climb = 10.0
	#Air use of a Netherite Rig relative to Copper
	# Default: 0.5
	# Range: 0.0 ~ 4.0
	netheriteFactor = 0.5

[crawl]
	#Descent speed with no Air left (Crawl), blocks per second
	# Default: 1.0
	# Range: 0.1 ~ 8.0
	speed = 1.0

[enchant]
	#Far Reach: extra Reach per level, blocks
	# Default: 1.0
	# Range: 0.0 ~ 8.0
	farReachPerLevel = 1.0
	#Thrift: Air use cut per level (0.15 = -15 %). Level III stays above zero
	# Default: 0.15
	# Range: 0.0 ~ 0.3
	thriftPerLevel = 0.15
	#Swift: extra Speed per level (0.15 = +15 %)
	# Default: 0.15
	# Range: 0.0 ~ 1.0
	swiftPerLevel = 0.15

[ships]
	#Rigs grip Sable Ships like world blocks. Ignored without Sable
	grip = true
