plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '1.0.0'
group = 'dev.wyseman.harnessportals'
base { archivesName = 'adventurersharnessportals' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

def ipJar = file("${rootDir}/../../.pakku/overrides/mods/ip_aeronautics-2.8.17.jar")
if (!ipJar.isFile() || ipJar.length() < 1_000_000) {
    throw new GradleException("Need the real Immersive Portals jar via git lfs: ${ipJar}")
}

def harnessCandidates = [
    file("${rootDir}/../../mods/adventurers_harness-1.2-Sable-NeoForge-1.21.1.jar"),
    file("${System.getProperty('user.home')}/.var/app/org.prismlauncher.PrismLauncher/data/PrismLauncher/instances/Autisnautics-1.21/minecraft/mods/adventurers_harness-1.2-Sable-NeoForge-1.21.1.jar")
]
def harnessJar = harnessCandidates.find { it.isFile() && it.length() > 100_000 }
if (harnessJar == null) {
    throw new GradleException("Could not find adventurers_harness-1.2-Sable-NeoForge-1.21.1.jar in ${harnessCandidates}")
}

neoForge {
    version = '21.1.265'
    mods {
        adventurers_harness_portals { sourceSet sourceSets.main }
    }
}

dependencies {
    compileOnly files(ipJar, harnessJar)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-proc:none')
}
