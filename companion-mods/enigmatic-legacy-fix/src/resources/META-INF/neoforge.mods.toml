[[mods]]
modId = "enigmaticlegacyfix"
version = "1.0.0"
displayName = "Enigmatic Legacy Setup Fix"
authors = "Autisnautics"
description = '''Lets EnigmaticLegacy+ 1.21.1-1.1.2 finish common setup on a dedicated server. CommonProxy.init registers a dispenser behavior from the parallel FMLCommonSetupEvent, and that races other mods on the unsynchronized dispenser map. The registration is deferred with event.enqueueWork. Client and server both do this.'''

[[mixins]]
config = "enigmaticlegacyfix.mixins.json"

