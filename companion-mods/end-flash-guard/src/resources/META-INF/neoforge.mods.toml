[[mods]]
modId = "endflashguard"
version = "1.0.0"
displayName = "End Flash Guard"
authors = "Autisnautics"
description = '''Stops VanillaBackport end flashes from ticking on Immersive Portals background client levels. Sound, sky flash, and light stay on the dimension the player is in. Client only.'''
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "endflashguard.mixins.json"

[[dependencies.endflashguard]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.endflashguard]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.265,21.2)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.endflashguard]]
modId = "vanillabackport"
type = "required"
versionRange = "[1.2.2,1.3)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.endflashguard]]
modId = "immersive_portals"
type = "optional"
versionRange = "[6.0.7,7.0.0)"
ordering = "AFTER"
side = "CLIENT"
