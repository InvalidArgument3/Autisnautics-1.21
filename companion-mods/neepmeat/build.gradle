plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = '0.30.0-neoforge.52'
group = 'com.neep'
base { archivesName = 'neepmeat' }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
    withSourcesJar()
}

sourceSets {
    staged {
        java.srcDir 'src/staged/java'
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
    }
    main {
        java {
            def excludeFile = file('tools/port-errors/exclude.txt')
            if (excludeFile.exists()) {
                exclude excludeFile.readLines().findAll { it && !it.startsWith('#') }
            }
        }
    }
}

neoForge {
    version = '21.1.265'
    mods {
        neepmeat { sourceSet sourceSets.main }
        meatlib { sourceSet sourceSets.main }
    }
    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
        }
    }
    // Headless NeoForge game tests (./gradlew test). Plain JUnit still runs in that task.
    unitTest {
        enable()
    }
    accessTransformers = files('src/main/resources/META-INF/accesstransformer.cfg')
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    maven { url = 'https://repo.sleeping.town/' }
    maven { url = 'https://maven.createmod.net/' }
}

dependencies {
    // runtimeOnly is on the dev game classpath and is not packed into the mod jar.
    // The pack already ships these jars.
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.64.0.455'
    runtimeOnly 'mezz.jei:jei-1.21.1-neoforge:19.64.0.455'
    compileOnly 'dev.emi:emi-neoforge:1.1.24+1.21.1'
    runtimeOnly 'dev.emi:emi-neoforge:1.1.24+1.21.1'
    compileOnly 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.3'
    runtimeOnly 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.3'
    // Create 1.21.1-6.0.10 pins flywheel 1.0.6 and does not jar it into NeepMeat.
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-proc:none', '-Xmaxerrs', '100000'])
}

tasks.named('compileStagedJava') {
    options.compilerArgs.addAll(['-Xmaxerrs', '8000'])
}

tasks.named('test') {
    useJUnitPlatform()
}
